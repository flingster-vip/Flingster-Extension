<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flingster Access</title>
  <meta name="theme-color" content="#101018" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #101018;
      --surface: #181822;
      --surface-raised: #20202c;
      --border: rgba(255,255,255,.09);
      --accent: #ff5b67;
      --accent-bright: #ff786c;
      --accent-dim: rgba(255,91,103,.12);
      --accent-glow: rgba(255,91,103,.23);
      --text: #f8f6f7;
      --muted: #9693a3;
      --success: #52dfa2;
      --success-dim: rgba(82,223,162,.1);
      --warning: #ffc66d;
    }

    * { box-sizing: border-box; }

    body {
      width: 360px;
      min-height: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: absolute;
      top: -130px;
      right: -100px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,91,103,.15), rgba(255,91,103,0) 70%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 22px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-group { flex: 1; }

    h1 {
      font-size: 16px;
      font-weight: 750;
      letter-spacing: -.45px;
      line-height: 1;
      color: var(--text);
    }

    .subtitle {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .01em;
      margin-top: 5px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--muted);
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.035);
      transition: color .2s, background .2s, border-color .2s;
    }

    .status-pill.active {
      color: var(--success);
      border-color: rgba(82,223,162,.24);
      background: var(--success-dim);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    .intro { display:flex; flex-direction:column; gap:5px; }
    .intro-title { font-size:14px; font-weight:650; letter-spacing:-.2px; }
    .intro-copy { color:var(--muted); font-size:11px; line-height:1.5; }

    .input-group { display: flex; flex-direction: column; gap: 9px; }

    label {
      font-size: 11px;
      font-weight: 600;
      color: #d6d3dd;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 42px 12px 13px;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      letter-spacing: .03em;
    }

    input:focus {
      border-color: rgba(255,120,108,.75);
      background: #1c1b26;
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    input::placeholder { color: #777483; letter-spacing: 0; }

    .toggle-vis {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 5px;
      border-radius: 6px;
      display: flex;
      transition: color .2s, background .2s;
    }

    .toggle-vis:hover { color: var(--text); background: rgba(255,255,255,.06); }

    .remember {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
    }

    .remember input[type="checkbox"] { position:absolute; opacity:0; width:1px; height:1px; }

    .checkbox-ui {
      width: 16px;
      height: 16px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      flex-shrink: 0;
    }

    .remember input:checked ~ .checkbox-ui {
      background: var(--accent);
      border-color: var(--accent);
    }

    .remember input:focus-visible ~ .checkbox-ui { outline:2px solid var(--accent-bright); outline-offset:2px; }

    .checkmark { display: none; }
    .remember input:checked ~ .checkbox-ui .checkmark {
      display: block;
      color: white;
    }

    .remember span { color: var(--muted); font-size: 11px; font-weight: 450; }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 11px;
      border: none;
      background: linear-gradient(110deg, #ff706a, #f04b74);
      color: white;
      font: inherit;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .01em;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, filter .2s;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(240,75,116,.2), inset 0 1px rgba(255,255,255,.25);
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.06);
      box-shadow: 0 8px 24px var(--accent-glow), inset 0 1px rgba(255,255,255,.25);
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) { transform: translateY(0); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn.loading .btn-text { opacity: 0; }
    .btn.loading .spinner { display: block; }

    .spinner {
      display: none;
      position: absolute;
      inset: 0;
      margin: auto;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .message {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.5;
      animation: slideIn .2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.error {
      display: flex;
      gap: 8px;
      background: var(--accent-dim);
      border: 1px solid rgba(255,91,103,.25);
      color: #ff9295;
    }

    .message.success {
      display: flex;
      gap: 8px;
      background: var(--success-dim);
      border: 1px solid rgba(82,223,162,.22);
      color: var(--success);
    }

    .message svg { flex-shrink: 0; margin-top: 1px; }

    .cookie-info {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.9;
      color: var(--muted);
    }

    .cookie-info.visible { display: block; }

    .cookie-info strong {
      color: var(--text);
      font-weight: 500;
    }

    .expire-badge {
      display: inline-block;
      background: rgba(255,198,109,.1);
      color: var(--warning);
      border: 1px solid rgba(255,198,109,.22);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 9px;
    }

    .btn-ghost {
      width: 100%;
      padding: 9px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.025);
      color: #b3afbc;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: all .2s;
    }

    .btn-ghost:hover {
      border-color: rgba(255,255,255,.2);
      background: rgba(255,255,255,.055);
      color: var(--text);
    }

    .booking-link {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 2px 0 1px;
      color: #c1bdcb;
      font-size:11px;
      font-weight:550;
      text-decoration:none;
      transition:color .2s;
    }
    .booking-link:hover { color: var(--accent-bright); }
    .booking-link svg { width:14px; height:14px; color:var(--accent-bright); }

    button:focus-visible, a:focus-visible { outline:2px solid var(--accent-bright); outline-offset:3px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="title-group">
      <h1>Member Access</h1>
      <div class="subtitle">Flingster · Secure Auth</div>
    </div>
    <div class="status-pill" id="statusPill">
      <div class="dot"></div>
      <span id="statusText">Idle</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="intro">
    <div class="intro-title">Your private access, made simple</div>
    <div class="intro-copy">Enter your member password to securely activate your Flingster session.</div>
  </div>

  <div class="message" id="message">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8v4M12 16h.01"/>
    </svg>
    <span id="messageText"></span>
  </div>

  <div class="cookie-info" id="cookieInfo">
    <div>Token set on <strong>flingster.com</strong></div>
    <div>Expires: <span class="expire-badge" id="expireDisplay">—</span></div>
  </div>

  <div class="input-group" id="inputSection">
    <label for="passwordInput">Access Password</label>
    <div class="input-wrap">
      <input type="password" id="passwordInput" placeholder="Enter your password…" autocomplete="off" spellcheck="false"/>
      <button class="toggle-vis" id="toggleVis" title="Show/hide password" type="button">
        <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <label class="remember" for="rememberCheck">
      <input type="checkbox" id="rememberCheck"/>
      <div class="checkbox-ui">
        <svg class="checkmark" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <span>Remember password (saved locally)</span>
    </label>
  </div>

  <button class="btn" id="authBtn" type="button">
    <span class="btn-text">Authenticate</span>
    <div class="spinner"></div>
  </button>

  <button class="btn-ghost" id="clearBtn" type="button">Clear Session &amp; Cookie</button>

  <div class="divider"></div>

  <a href="https://slotbooking--imadi0007.replit.app/" target="_blank" rel="noopener noreferrer" class="booking-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>
    Book your access code
  </a>

</div>
<script src="popup.js"></script>
</body>
</html>
